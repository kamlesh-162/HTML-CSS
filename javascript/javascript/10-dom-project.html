<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM-project</title>
  <style>

  body{
     font-family: Arial, Helvetica, sans-serif;
     
  }

 .subbutton{
  border:none;
  color: white;
  background-color:black;
  padding: 10px 15px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom : 30px;
  
 }

 .is-subscribed{
  background-color: rgb(194, 194, 194);
  color: black;
  border:none;
 }
 .cost-input{
  font-size: 15px;
  padding: 10px;
  border-radius: 10px;
  border: 1px gray solid;
 }
 .cal-but{
  background-color: green;
  color: white;
  font-size: 15px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  border: 2px solid green;
  cursor: pointer;
 }


  </style>
</head>
<body>

  <p>YouTube Subscribe Button</p>

  <button class="sub subbutton" onclick=" sub(); ">Subscribe</button>

 
  <h2>Amazon Shipping Calculater</h2>
  <p>Order under 40$  required +10$ shipping</p>
  <p>Order over 40$ FREE Shipping</p>
  <input  placeholder="cost of order"  class="js-input cost-input" 
   onkeydown="
           HandleKeyDown(event);
            ">
 
 <button class="cal-but" onclick="
   calTotal();
  ">Calculate</button>
  <p class="js-total"></p>

  <script>


     function  HandleKeyDown(event){
           if(event.key=='Enter'){
              calTotal();
            }

     }

     function calTotal(){
      const inputElement=document.querySelector('.js-input');
      let cost =Number(inputElement.value);
    
      if(cost<40){
        cost=cost+10;
      }
      document.querySelector('.js-total').innerHTML=`${cost}$`;
     }

     function sub(){
       const buttonelement2=document.querySelector('.sub');
       console.log(document.querySelector('.sub').innerHTML);  // console output
      
        if(buttonelement2.innerText==='Subscribe'){    // innnerTEXT property extra spaces
         buttonelement2.innerHTML='Subscribed';
         buttonelement2.classList.add('is-subscribed');
        }else{
          buttonelement2.innerHTML='Subscribe';
          buttonelement2.classList.remove('is-subscribed');
        }
      }

  </script>
</body>
</html>
