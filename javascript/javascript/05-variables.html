<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-variable    </title>
   
</head>
<body>
   
    <script>
      let variable1=3;
      console.log(variable1);

      let cal=2+2;
      console.log(cal);
      console.log(cal + 2);

      let result = cal + 2;
      console.log(result);

      let message = 'hello';
      console.log(message);
      
      cal=2;
      console.log(cal + 2);

      const var2 =4;
       console.log(var2);

       var var3=5;
        console.log(var3);

       
    </script>

</body>
</html>
