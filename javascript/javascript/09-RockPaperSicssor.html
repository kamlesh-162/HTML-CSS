<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rock-paper-sicssores</title>
</head>
<body>
  <h1 > rock-paper-sicssores</h1>
  <hr>

  <button onclick="
  playgame('rock');
  ">Rock</button>

  <button onclick="
    playgame('paper');
  
  ">Paper</button>

  <button onclick="
     playgame('Sicssores');

  ">Sicssores</button>

  <p class="js-result"></p>
  <p class="js-moves"></p>
  
  <p class="js-score"></p>
  
  <button onclick="
    score.win=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('score', JSON.stringify(score));
    updatescore();

  ">Reset Score</button>

  <script>

    let score=JSON.parse(localStorage.getItem('score'))
     || {
        win:0,
        losses:0,
        ties:0
    };
    
    
    //  updatescore(); 
     updatescore();
    //  document.querySelector(".js-result").innerHTML=`result: ${result}`;
    //  document.querySelector(".js-moves").innerHTML=`You Pick ${playerMove}. Computer picks ${computermove}`;
   
   
   function playgame(playerMove){

         let computermove=pickComputerMove();
         console.log(computermove);

          let result='';

          if(playerMove==='Sicssores')
          {
            if(computermove==='rock'){
              result='you loss.';
            }else if(computermove==='paper'){
              result='you win.';
            }else if(computermove==='Sicssores'){
              result='tai.';
            }
          }else if(playerMove==='rock')
          {
            if(computermove==='rock'){
              result='tai.';
            }else if(computermove==='paper'){
              result='you loss.';
            }else if(computermove==='Sicssores'){
              result='you win.';
            }
          }else if(playerMove==='paper')
          {
            if(computermove==='rock'){
              result='you win.';
            }else if(computermove==='paper'){
              result='tai.';
            }else if(computermove==='Sicssores'){
              result='you loss.';
            }
          }
          
          if(result==='you win.'){
            score.win=score.win+1;
          }else if(result==='you loss.'){
            score.losses=score.losses+1;
          }else if(result==='tai.'){
            score.ties=score.ties+1;
          }
          
          localStorage.setItem('score', JSON.stringify(score));
          
          updatescore();
          document.querySelector(".js-result").innerHTML=`result:${result}`;
          document.querySelector(".js-moves").innerHTML=`You Pick ${playerMove}. Computer picks ${computermove}`;
         

          
    }

        function updatescore(){
          document.querySelector('.js-score').innerHTML=`wins:${score.win}, losses:${score.losses}, Ties:${score.ties}`;

        }


        function pickComputerMove(){
          const randomNum=Math.random();
          let computermove='';
     
            console.log(randomNum);
            if(randomNum>=0 && randomNum<1/3){
              computermove='rock';
            }else if(randomNum>=1/3 && randomNum<2/3){
             computermove='paper';
            }else if(randomNum>=2/3 && randomNum<1){
             computermove='Sicssores';
            }
     
            return computermove; 
        }
  </script>

</body>
</html>
