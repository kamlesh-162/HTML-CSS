<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rock-paper-sicssores</title>
</head>
<body>
  <h1 > rock-paper-sicssores</h1>
  <hr>

  <button onclick="
  playgame('rock');
  ">Rock</button>

  <button onclick="
    playgame('paper');
  
  ">Paper</button>

  <button onclick="
     playgame('Sicssores');

  ">Sicssores</button>

  <script>
    
    function pickComputerMove(){
      const randomNum=Math.random();
      let computermove='';
 
        console.log(randomNum);
        if(randomNum>=0 && randomNum<1/3){
          computermove='rock';
        }else if(randomNum>=1/3 && randomNum<2/3){
         computermove='paper';
        }else if(randomNum>=2/3 && randomNum<1){
         computermove='Sicssores';
        }

        return computermove; 
    }

    function playgame(playerMove){
      let computermove=pickComputerMove();
         console.log(computermove);
          let result='';
          if(playerMove==='Sicssores'){
            if(computermove==='rock'){
              result='you loss';
            }else if(computermove==='paper'){
              result='you win.';
            }else if(computermove==='Sicssores'){
              result='Tai.';
            }
          }else if(playerMove==='rock'){
            if(computermove==='rock'){
              result='tai';
            }else if(computermove==='paper'){
              result='you loss.';
            }else if(computermove==='Sicssores'){
              result='you win.';
            }
          }else if(playerMove==='paper'){
            if(computermove==='rock'){
              result='you win';
            }else if(computermove==='paper'){
              result='tai.';
            }else if(computermove==='Sicssores'){
              result='you loss.';
            }
          }

          
           alert(`You Pick ${playerMove}. Computer picks ${computermove}. ${result}`);
    }
  </script>

</body>
</html>
