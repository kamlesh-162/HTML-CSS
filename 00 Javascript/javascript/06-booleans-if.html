<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>js-booleans</title>
</head>
<body>
    <script>
      console.log(typeof(true));  // bool
      console.log(typeof('true'));// string


      console.log(3<5);
      console.log(3>5);

      console.log(5 == '5.00');    //== assinge 
      console.log(5 === '5.00');   // compare

     
      if(true){
        console.log('hello');
      }

      if(false){
        console.log('hello');
      }else{
        console.log('else');
      }


      let age =30;
      if(age>=16){
        console.log('you can drive');
        console.log('congrats');
      }else{
        console.log('you can not drive');
      }
     
       
    </script>
</body>
</html>
