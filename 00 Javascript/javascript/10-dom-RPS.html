<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rock-paper-sicssores</title>
  <style>
    body{
      background-color:black;
      color: rgb(255, 255, 255);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

    }

    .title{
         font-size: 30px;
         font-weight: bold;
    }
    
    .icon{
      width: 60px;
      
     
    }
    .res-icon{
      margin: 0px 20px;
    }
    .but{
      background-color:transparent;
      border-radius: 60px;
      border: solid 3px rgb(255, 255, 255);
      width: 120px;
      height: 120px;
      margin: 20px;
    }
    .result{
      font-size: 25px;
      font-weight: bold;
      margin-top: 50px;
    }
    .score{
      font-size: 25px;
      /* font-weight: bold; */
      margin-top: 50px;
    }
    .reset-but{
      background-color: #fff;
      border: none;
      font-size: 15px;
      padding: 8px 15px;
      cursor: pointer ;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      margin: 0px 20px;
    }
    .reset-but:hover{
      background-color: green;
      color: white;
    }
  </style>
</head>
<body>
  <h1 class="title" > Rock-Paper-Sicssores</h1>
  <hr style=" width: 80%;">
  <div class="button-arrang">
      <button class="but" onclick="
      playgame('rock');
      "><img src="img/rock-emoji.png" alt="" class="icon you"></button>

      <button  class="but" onclick="
        playgame('paper');
      
      "><img src="img/paper-emoji.png" alt="" class="icon computer"></button>

      <button class="but"  onclick="
        playgame('scissors');

      "><img src="img/scissors-emoji.png" alt="" class="icon"></button>

 </div>
  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>
  
  <button class="reset-but" onclick="
    score.win=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('score', JSON.stringify(score));
    updatescore();

  ">Reset Score</button>

  <script>

    let score=JSON.parse(localStorage.getItem('score'))
     || {
        win:0,
        losses:0,
        ties:0
    };
    
    
    //  updatescore(); 
     updatescore();
    //  document.querySelector(".js-result").innerHTML=`result: ${result}`;
    //  document.querySelector(".js-moves").innerHTML=`You Pick ${playerMove}. Computer picks ${computermove}`;
   
   
   function playgame(playerMove){

         let computermove=pickComputerMove();
         console.log(computermove);

          let result='';

          if(playerMove==='scissors')
          {
            if(computermove==='rock'){
              result='you loss.';
            }else if(computermove==='paper'){
              result='you win.';
            }else if(computermove==='scissors'){
              result='tai.';
            }
          }else if(playerMove==='rock')
          {
            if(computermove==='rock'){
              result='tai.';
            }else if(computermove==='paper'){
              result='you loss.';
            }else if(computermove==='scissors'){
              result='you win.';
            }
          }else if(playerMove==='paper')
          {
            if(computermove==='rock'){
              result='you win.';
            }else if(computermove==='paper'){
              result='tai.';
            }else if(computermove==='scissors'){
              result='you loss.';
            }
          }
          
          if(result==='you win.'){
            score.win=score.win+1;
          }else if(result==='you loss.'){
            score.losses=score.losses+1;
          }else if(result==='tai.'){
            score.ties=score.ties+1;
          }
          
          localStorage.setItem('score', JSON.stringify(score));
          
          updatescore();
          document.querySelector(".js-result").innerHTML=`Result : ${result}`;
          document.querySelector(".js-moves").innerHTML=`You  <img src="img/${playerMove}-emoji.png" alt="" class="icon res-icon"> <img src="img/${computermove}-emoji.png" alt="" class="icon res-icon"> Computer `;
         
         

          
    }

        function updatescore(){
          document.querySelector('.js-score').innerHTML=`wins:${score.win}, losses:${score.losses}, Ties:${score.ties}`;

        }


        function pickComputerMove(){
          const randomNum=Math.random();
          let computermove='';
     
            console.log(randomNum);
            if(randomNum>=0 && randomNum<1/3){
              computermove='rock';
            }else if(randomNum>=1/3 && randomNum<2/3){
             computermove='paper';
            }else if(randomNum>=2/3 && randomNum<1){
             computermove='scissors';
            }
     
            return computermove; 
        }
  </script>

</body>
</html>
